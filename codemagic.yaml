workflows:
  android-workflow:
    name: Android APK Workflow
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.5
    scripts:
      - name: Setup and Build APK
        script: |
          PROJ_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$PROJ_DIR"
          
          flutter clean
          flutter pub get
          
          # 1. Firebase'in istediği minSdkVersion 23 ayarını yapıyoruz
          sed -i '' 's/minSdkVersion.*/minSdkVersion = 23/g' android/app/build.gradle || sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
          
          # 2. Plugins bloğu çakışmasını çözüyoruz
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i '' 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/g' android/settings.gradle.kts
          elif [ -f "android/settings.gradle" ]; then
            sed -i '' 's/plugins {/plugins {\n    id "com.google.gms.google-services" version "4.4.1" apply false/g' android/settings.gradle
          fi
          
          # 3. Paket adı kilitlerini kırıyoruz: 'com.example.eenapp' olan her yeri düz 'eenapp' yapıyoruz
          # (Firebase json dosyanla birebir eşleşmesini sağlar)
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "AndroidManifest.xml" -o -name "MainActivity.kt" -o -name "MainActivity.java" \) -exec sed -i '' 's/com.example.eenapp/eenapp/g' {} + || find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "AndroidManifest.xml" -o -name "MainActivity.kt" -o -name "MainActivity.java" \) -exec sed -i 's/com.example.eenapp/eenapp/g' {} +
          
          # Son olarak derlemeyi başlatıyoruz
          flutter build apk --release --no-shrink
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
