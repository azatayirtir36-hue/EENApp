workflows:
  android-workflow:
    name: Android APK Workflow
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.5
    scripts:
      - name: Setup and Build APK
        script: |
          PROJ_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$PROJ_DIR"
          
          flutter clean
          flutter pub get
          
          # 1. Firebase içinSdkVersion ayarını 23 yapar
          sed -i '' 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle || sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
          
          # 2. Eksik olan Google Services eklenti sürümünü projenin ayarlarına zorla ekler
          if [ -f "android/settings.gradle" ]; then
            echo 'plugins { id "com.google.gms.google-services" version "4.4.1" apply false }' >> android/settings.gradle
          elif [ -f "android/settings.gradle.kts" ]; then
            echo 'plugins { id("com.google.gms.google-services") version "4.4.1" apply false }' >> android/settings.gradle.kts
          fi
          
          # Derlemeyi başlatır
          flutter build apk --release --no-shrink
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
