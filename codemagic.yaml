workflows:
  android-workflow:
    name: Android APK Workflow
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.5
    scripts:
      - name: Setup and Build APK
        script: |
          PROJ_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$PROJ_DIR"
          
          flutter clean
          flutter pub get
          
          # 1. Hatalı Gradle komutunu temizleyip minSdkVersion ayarını esnek biçimde yapıyoruz
          find android/ -name "build.gradle*" -exec sed -i '' 's/minSdkVersion.*/minSdkVersion = 23/g' {} + || true
          
          # 2. Plugins bloğu çakışmasını çözüyoruz
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i '' 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/g' android/settings.gradle.kts
          elif [ -f "android/settings.gradle" ]; then
            sed -i '' 's/plugins {/plugins {\n    id "com.google.gms.google-services" version "4.4.1" apply false/g' android/settings.gradle
          fi
          
          # 3. KESİN ÇÖZÜM: google-services.json dosyasının içindeki gerçek paket adını otomatik okuyoruz
          # Ve projenin tüm yerel dosyalarındaki paket adını bu gerçek isimle zorla eşitliyoruz!
          JSON_PACKAGE=$(grep -o '"package_name": "[^"]*' android/app/google-services.json | head -n 1 | cut -d'"' -f4)
          if [ ! -z "$JSON_PACKAGE" ]; then
            echo "Firebase Paket Adı Tespit Edildi: $JSON_PACKAGE"
            find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "AndroidManifest.xml" -o -name "MainActivity.kt" -o -name "MainActivity.java" \) -exec sed -i '' "s/com.example.eenapp/$JSON_PACKAGE/g" {} + || true
            find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "AndroidManifest.xml" -o -name "MainActivity.kt" -o -name "MainActivity.java" \) -exec sed -i '' "s/eenapp/$JSON_PACKAGE/g" {} + || true
          fi
          
          # Derlemeyi başlatıyoruz
          flutter build apk --release --no-shrink
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"

