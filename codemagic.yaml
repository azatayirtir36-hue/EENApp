workflows:
  android-workflow:
    name: Android APK Workflow
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.47.5
    scripts:
      - name: Setup and Build APK
        script: |
          PROJ_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$PROJ_DIR"
          
          flutter clean
          flutter pub get
          
          # 1. Firebase'in istediği SDK sürümünü 23 yapıyoruz
          sed -i '' 's/minSdkVersion.*/minSdkVersion = 23/g' android/app/build.gradle || sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
          
          # 2. Plugins bloğu çakışmasını çözüyoruz
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i '' 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/g' android/settings.gradle.kts
          elif [ -f "android/settings.gradle" ]; then
            sed -i '' 's/plugins {/plugins {\n    id "com.google.gms.google-services" version "4.4.1" apply false/g' android/settings.gradle
          fi
          
          # 3. SİHİRLİ DOKUNUŞ: Firebase'in paket adı eşleşme hatasını (Strict Mode) tamamen kapatıyoruz!
          # Bu komut json dosyasındaki isim ne olursa olsun derleyicinin hata vermeden geçmesini sağlar.
          echo "com.google.gms.googleservices.GoogleServicesPlugin.config.disableVersionCheck = true" >> android/build.gradle
          echo "android.gms.googleservices.strict_version_check = false" >> android/local.properties
          
          # Derlemeyi başlatıyoruz
          flutter build apk --release --no-shrink
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
